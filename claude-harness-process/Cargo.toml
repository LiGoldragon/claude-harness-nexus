[package]
name = "claude-harness-process"
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
datom = ["dep:datom-codec", "process/datom", "harness/datom", "flow/datom"]

[dependencies]
process = { path = "../process" }
harness = { package = "harness-nexus-library", git = "https://github.com/LiGoldragon/harness-nexus-library", rev = "3613d63d0994de7841bcf6f070c83bebb0ddfa5a" }
flow = { package = "flow-ethos", git = "https://github.com/LiGoldragon/flow", rev = "062ef9e1", default-features = false }
rkyv = { workspace = true }
datom-codec = { workspace = true, optional = true }

[lints.rust]
unsafe_code = "forbid"
