[package]
name = "claude-harness-nexus"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
process = { package = "process-library", git = "https://github.com/LiGoldragon/process-library", rev = "d797e2139e3af50c53b029cc3b8626f55220b56a" }
claude-harness-process = { path = "../claude-harness-process" }
transport = { path = "../transport" }
harness = { package = "harness-nexus-library", git = "https://github.com/LiGoldragon/harness-nexus-library", rev = "ae7e008700972b7f033de6ba94c36e6c49fc93f8" }
flow = { package = "flow-ethos", git = "https://github.com/LiGoldragon/flow", rev = "062ef9e1", default-features = false }
rkyv = { workspace = true }
rustix = { workspace = true }
signal-harness = { git = "https://github.com/LiGoldragon/signal-harness", rev = "f302b3088c719a3df1991b7701899dea7dce7288" }
signal-claude-prepare = { git = "https://github.com/LiGoldragon/signal-claude-prepare", rev = "3776141276237e2a88bd458ec15b3ccc0396faf9" }

[lints.rust]
unsafe_code = "forbid"
