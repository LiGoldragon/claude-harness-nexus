[package]
name = "claude-harness-nexus"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
process = { package = "process-library", git = "https://github.com/LiGoldragon/process-library", rev = "d797e2139e3af50c53b029cc3b8626f55220b56a" }
claude-harness-process = { path = "../claude-harness-process" }
transport = { path = "../transport" }
harness = { package = "harness-nexus-library", git = "https://github.com/LiGoldragon/harness-nexus-library", rev = "3613d63d0994de7841bcf6f070c83bebb0ddfa5a" }
flow = { package = "flow-ethos", git = "https://github.com/LiGoldragon/flow", rev = "062ef9e1", default-features = false }
rkyv = { workspace = true }
rustix = { workspace = true }
signal-harness = { git = "https://github.com/LiGoldragon/signal-harness", rev = "eea28159303e9b51e4e211151aba0a3ceb686a32" }
signal-claude-prepare = { git = "https://github.com/LiGoldragon/signal-claude-prepare", rev = "1c1b040f545d4368451894e988073449b4591299" }

[lints.rust]
unsafe_code = "forbid"
